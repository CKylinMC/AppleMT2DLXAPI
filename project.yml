name: AppleMTDeepLX
options:
  bundleIdPrefix: in.ckyl
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
targets:
  AppleMTDeepLX:
    type: application
    platform: macOS
    sources:
      - path: Sources/AppleMTDeepLX
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.ckyl.applemtdeeplx
        PRODUCT_NAME: AppleMTDeepLX
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_APP_SANDBOX: NO
